<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABES WiFi Auto Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>ABES WiFi Auto Login</h1>
      <div id="networkStatus" class="network-status checking">Checking Wi-Fi...</div>
    </header>

    <section class="card">
      <div class="field">
        <label for="targetSSID">College Wi-Fi SSID</label>
        <input id="targetSSID" type="text" value="ABESEC" placeholder="e.g. ABESEC">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="College username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="College password">
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="row-text">
          <label class="switch-label" for="autoReconnect">Auto Reconnect</label>
          <span class="hint">Signs in again on a timer</span>
        </div>
        <input id="autoReconnect" class="switch" type="checkbox">
      </div>

      <div class="field">
        <label for="intervalValue">Reconnect every</label>
        <div class="interval-row">
          <input id="intervalValue" type="number" min="1" step="1" value="2">
          <select id="intervalUnit">
            <option value="minutes">Minutes</option>
            <option value="hours" selected>Hours</option>
          </select>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="save" type="button">Save Settings</button>
      <button id="connect" type="button">Connect Now</button>
    </div>

    <p id="nextRun">Auto reconnect is off or sleeping</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
